openapi: 3.1.0
info:
  title: SplitWise Pro API
  version: 1.0.0
  description: Local-first single-workspace shared expense ledger. Integer minor currency
    units only (2 decimals for KZT/USD/EUR/GBP). Names and descriptions are trimmed.
    All writes validated atomically. Empty workspace on first start. In-memory and
    SQLite implementations share this contract. Invalid input returns 422 with detail
    string; missing resource 404. No authentication or real money transfer.
servers:
- url: http://127.0.0.1:8000
tags:
- name: System
- name: Groups
- name: Members
- name: Expenses
- name: Balances
- name: Settlements
- name: Analytics
paths:
  /api/health:
    get:
      tags:
      - System
      summary: Service health
      operationId: get_health
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Resource not found
        '409':
          description: 'Resource conflict: a referenced member cannot be removed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Resource conflict: a referenced member cannot be removed'
        '422':
          description: Invalid input or domain invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid input or domain invariant violation
  /api/groups:
    get:
      tags:
      - Groups
      summary: List all groups
      operationId: get_groups
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Resource not found
        '409':
          description: 'Resource conflict: a referenced member cannot be removed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Resource conflict: a referenced member cannot be removed'
        '422':
          description: Invalid input or domain invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid input or domain invariant violation
    post:
      tags:
      - Groups
      summary: Create a group
      operationId: post_groups
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Resource not found
        '409':
          description: 'Resource conflict: a referenced member cannot be removed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Resource conflict: a referenced member cannot be removed'
        '422':
          description: Invalid input or domain invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid input or domain invariant violation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
  /api/groups/{group_id}:
    get:
      tags:
      - Groups
      summary: Get group details
      operationId: get_groups_group_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
