          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Resource conflict: a referenced member cannot be removed'
        '422':
          description: Invalid input or domain invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid input or domain invariant violation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      parameters:
      - name: group_id
        in: path
        required: true
