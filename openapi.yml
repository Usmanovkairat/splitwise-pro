          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Resource conflict: a referenced member cannot be removed'
        '422':
          description: Invalid input or domain invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid input or domain invariant violation
      parameters:
      - name: group_id
        in: path
        required: true
        schema: &id001
          type: string
          minLength: 1
          maxLength: 100
    put:
      tags:
      - Groups
      summary: Rename group and update description
      operationId: put_groups_group_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Resource not found
        '409':
          description: 'Resource conflict: a referenced member cannot be removed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Resource conflict: a referenced member cannot be removed'
        '422':
          description: Invalid input or domain invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid input or domain invariant violation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      parameters:
      - name: group_id
        in: path
        required: true
        schema: *id001
    delete:
      tags:
      - Groups
      summary: Delete group and all ledger data
      operationId: delete_groups_group_id
      responses:
        '204':
          description: Success
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Resource not found
        '409':
          description: 'Resource conflict: a referenced member cannot be removed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Resource conflict: a referenced member cannot be removed'
        '422':
          description: Invalid input or domain invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid input or domain invariant violation
      parameters:
      - name: group_id
        in: path
        required: true
        schema: *id001
      description: Cascades expenses, shares, settlements and members in one transaction.
