name: Deploy protected GCP workspace

on:
  workflow_run:
    workflows: [Verify SplitWise Pro]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: splitwise-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out exactly the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check required deployment configuration
        env:
          IMAGE: ${{ vars.GHCR_IMAGE }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM: ${{ vars.GCP_VM_NAME }}
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$IMAGE" && test -n "$PROJECT" && test -n "$ZONE" && test -n "$VM"
          test -n "$WIF" && test -n "$SERVICE_ACCOUNT"
          [[ "$IMAGE" =~ ^ghcr.io/[a-z0-9._/-]+$ ]]
      - name: Refuse an obsolete main revision
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$VERIFIED_SHA" = "$current_sha"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified revision image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.GHCR_IMAGE }}:${{ github.event.workflow_run.head_sha }}
      - name: Authenticate without a stored service-account key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Transfer release script through IAP
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM: ${{ vars.GCP_VM_NAME }}
        run: |
          gcloud compute scp deployment/deploy-gcp.sh "$VM:/tmp/splitwise-deploy.sh" --project="$PROJECT" --zone="$ZONE" --tunnel-through-iap --quiet
      - name: Deploy immutable image, check health and attempt rollback on failure
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM: ${{ vars.GCP_VM_NAME }}
          IMAGE: ${{ vars.GHCR_IMAGE }}@${{ steps.image.outputs.digest }}
        run: |
          gcloud compute ssh "$VM" --project="$PROJECT" --zone="$ZONE" --tunnel-through-iap --quiet --command="sudo bash /tmp/splitwise-deploy.sh '$IMAGE'"
