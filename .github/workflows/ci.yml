name: Verify SplitWise Pro

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: splitwise_test
          POSTGRES_USER: splitwise
          POSTGRES_PASSWORD: ci-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitwise -d splitwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://splitwise:ci-isolated-only@127.0.0.1:5432/splitwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Validate OpenAPI contract
        run: python -m openapi_spec_validator openapi.yml
      - name: Test backend, SQLite and PostgreSQL migration
        run: python -m pytest backend/tests observability/test_promotion.py -q
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test mock browser workflows
        working-directory: frontend
        run: npx playwright test
      - name: Test integrated SQLite browser workflows
        working-directory: frontend
        env:
          QA_PYTHON: python
        run: npx playwright test --config playwright.integration.config.ts
      - name: Test integrated PostgreSQL browser workflows
        working-directory: frontend
        env:
          QA_PYTHON: python
          QA_DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: npx playwright test --config playwright.integration.config.ts
      - name: Build and start full-stack Compose image
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: docker compose up --build --wait --wait-timeout 180
      - name: Test real Compose image in browser
        working-directory: frontend
        env:
          QA_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test --config playwright.integration.config.ts
      - name: Verify Compose persistence through recreation
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: python deployment/verify_compose.py
      - name: Collect Compose logs
        if: always()
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: docker compose logs --no-color > compose.log 2>&1
      - name: Stop test containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: docker compose down -v
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            compose.log
          if-no-files-found: ignore

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.4'
      - name: Validate shell scripts
        run: |
          for script in deployment/start.sh deployment/deploy-gcp.sh infra/gcp/startup.sh.tftpl; do
            bash -n "$script"
          done
      - name: Check Terraform format
        working-directory: infra/gcp
        run: terraform fmt -check
      - name: Initialize providers without account access
        working-directory: infra/gcp
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate infrastructure schema without provisioning
        working-directory: infra/gcp
        run: terraform validate -no-color

  release-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, infrastructure, observability]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    permissions:
      contents: read
      packages: write
    env:
      POSTGRES_PASSWORD: ci-development-disposable
      SPLITWISE_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - name: Set canonical registry path
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate
        uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
      - name: Deploy exact candidate to disposable development
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "SPLITWISE_IMAGE=$REGISTRY_IMAGE@$DIGEST" >> "$GITHUB_ENV"
          SPLITWISE_IMAGE="$REGISTRY_IMAGE@$DIGEST" docker compose -p splitwise-dev up -d --no-build --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:8000/api/health | jq -e '.status == "ok" and .database == "postgresql"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Test the exact development image in Chromium
        working-directory: frontend
        env:
          QA_BASE_URL: http://127.0.0.1:8000
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.integration.config.ts
      - name: Write verified release metadata
        run: |
          jq -n --arg image "$SPLITWISE_IMAGE" --arg revision "$GITHUB_SHA" '{image:$image, revision:$revision}' > release.json
          printf 'Development verified image `%s`\n\nRun ID `%s`\n' "$SPLITWISE_IMAGE" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-development-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove disposable development environment
        if: always()
        run: docker compose -p splitwise-dev down -v

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      POSTGRES_PASSWORD: disposable-dev-db
      GRAFANA_ADMIN_PASSWORD: disposable-dev-grafana
      ONCALL_WEBHOOK_TOKEN: disposable-dev-webhook-token-0123456789
      SPLITWISE_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test responder and validate dashboard JSON
        run: |
          python -m unittest discover -s oncall -v
          python -m json.tool observability/grafana/json/splitwise.json > /dev/null
      - name: Validate telemetry configuration and alert rules
        run: |
          d=(docker compose -f compose.yaml -f compose.observability.yaml -p splitwise-dev)
          "${d[@]}" config -q
          "${d[@]}" run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yaml
          "${d[@]}" run --rm --no-deps --entrypoint /bin/promtool prometheus test rules /etc/prometheus/alerts.test.yaml
          "${d[@]}" run --rm --no-deps otel-collector validate --config=/etc/otel/config.yaml
      - name: Start development stack
        run: docker compose -f compose.yaml -f compose.observability.yaml -p splitwise-dev up -d --build --wait --wait-timeout 180
      - name: Verify PostgreSQL workspace isolation
        run: |
          export POSTGRES_PASSWORD=disposable-prod-db SPLITWISE_ENVIRONMENT=production SPLITWISE_PORT=8001
          export GRAFANA_ADMIN_PASSWORD=disposable-prod-grafana GRAFANA_PORT=3001
          export ONCALL_WEBHOOK_TOKEN=disposable-prod-webhook-token-abcdefghijklmnopqrstuvwxyz
          d=(docker compose -f compose.yaml -f compose.observability.yaml -p splitwise-prod)
          "${d[@]}" build oncall
          "${d[@]}" up -d --no-build --wait --wait-timeout 180
          python observability/verify_isolation.py
          python observability/smoke.py -- -f compose.yaml -f compose.observability.yaml -p splitwise-prod
      - name: Verify metrics, logs, traces, dashboard and alert-to-incident
        run: python observability/smoke.py --alert -- -f compose.yaml -f compose.observability.yaml -p splitwise-dev
      - name: Capture development stack logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.observability.yaml -p splitwise-dev logs --no-color
      - name: Stop disposable test stacks
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.observability.yaml -p splitwise-dev down -v
          POSTGRES_PASSWORD=disposable-prod-db SPLITWISE_ENVIRONMENT=production SPLITWISE_PORT=8001 GRAFANA_PORT=3001 \
            docker compose -f compose.yaml -f compose.observability.yaml -p splitwise-prod down -v
