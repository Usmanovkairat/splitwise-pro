name: Verify SplitWise Pro

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: splitwise_test
          POSTGRES_USER: splitwise
          POSTGRES_PASSWORD: ci-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitwise -d splitwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://splitwise:ci-isolated-only@127.0.0.1:5432/splitwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Validate OpenAPI contract
        run: python -m openapi_spec_validator openapi.yml
      - name: Test backend, SQLite and PostgreSQL migration
        run: python -m pytest backend/tests -q
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test mock browser workflows
        working-directory: frontend
        run: npx playwright test
      - name: Test integrated SQLite browser workflows
        working-directory: frontend
        env:
          QA_PYTHON: python
        run: npx playwright test --config playwright.integration.config.ts
      - name: Test integrated PostgreSQL browser workflows
        working-directory: frontend
        env:
          QA_PYTHON: python
          QA_DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: npx playwright test --config playwright.integration.config.ts
      - name: Build and start full-stack Compose image
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: docker compose up --build --wait --wait-timeout 180
      - name: Test real Compose image in browser
        working-directory: frontend
        env:
          QA_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test --config playwright.integration.config.ts
      - name: Verify Compose persistence through recreation
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: python deployment/verify_compose.py
      - name: Collect Compose logs
        if: always()
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: docker compose logs --no-color > compose.log 2>&1
      - name: Stop test containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-compose-isolated-only
        run: docker compose down -v
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            compose.log
          if-no-files-found: ignore

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.4'
      - name: Validate shell scripts
        run: bash -n deployment/start.sh deployment/deploy-gcp.sh infra/gcp/startup.sh.tftpl
      - name: Check Terraform format
        working-directory: infra/gcp
        run: terraform fmt -check
      - name: Initialize providers without account access
        working-directory: infra/gcp
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate infrastructure schema without provisioning
        working-directory: infra/gcp
        run: terraform validate -no-color
