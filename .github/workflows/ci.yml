name: Verify SplitWise Pro

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Validate OpenAPI contract
        run: python -m openapi_spec_validator openapi.yml
      - name: Test backend and SQLite persistence
        run: python -m pytest backend/tests -q
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test mock browser workflows
        working-directory: frontend
        run: npx playwright test
      - name: Test integrated SQLite browser workflow
        working-directory: frontend
        env:
          QA_PYTHON: python
        run: npx playwright test --config playwright.integration.config.ts
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
