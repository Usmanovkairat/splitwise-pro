global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: splitwise-metrics
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: splitwise-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/probes.yaml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
