apiVersion: 1
datasources:
  - name: Prometheus
    uid: splitwise-prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
  - name: Loki
    uid: splitwise-loki
    type: loki
    url: http://loki:3100
    access: proxy
    editable: false
    jsonData:
      derivedFields:
        - name: Trace ID
          matcherRegex: "^trace_id$"
          matcherType: label
          datasourceUid: splitwise-tempo
          url: '$${__value.raw}'
  - name: Tempo
    uid: splitwise-tempo
    type: tempo
    url: http://tempo:3200
    access: proxy
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: splitwise-loki
        spanStartTimeShift: "-30s"
        spanEndTimeShift: "30s"
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
        customQuery: true
        query: '{service_name="splitwise-pro"} | trace_id="$${__trace.traceId}"'
