route:
  receiver: splitwise-oncall
  group_by: [alertname, environment, service]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 1h
receivers:
  - name: splitwise-oncall
    webhook_configs:
      - url: http://oncall:8080/alerts
        send_resolved: true
        max_alerts: 10
        timeout: 20s
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/oncall_webhook_token
